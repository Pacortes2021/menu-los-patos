name: Menu diario Los Patos

on:
  repository_dispatch:
    # cron-job.org llama a la API de GitHub exactamente a las 08:00 AM Chile (12:00 UTC).
    # Este trigger tiene prioridad alta y se ejecuta en segundos, sin el delay de schedule.
    types: [menu-diario]
  schedule:
    # Respaldo por si falla cron-job.org (puede demorar hasta 2h en GitHub, pero es seguro).
    # 12:05 UTC = 08:05 AM Chile (invierno UTC-4).
    - cron: "5 12 * * 1-5"
  workflow_dispatch: {}   # ejecucion manual desde la pestana Actions

permissions:
  contents: write

jobs:
  menu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Scrapear y construir menu.json
        working-directory: scraper
        run: python build.py

      - name: Enviar menu de hoy por WhatsApp
        working-directory: scraper
        env:
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: python notify_whatsapp.py

      - name: Guardar cambios en data/
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/menu.json data/estado.json
          if git diff --staged --quiet; then
            echo "Sin cambios que guardar."
          else
            git commit -m "menu: actualizar $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push origin main
          fi
