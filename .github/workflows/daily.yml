name: Menu diario Los Patos

on:
  schedule:
    # Se ejecuta varias veces en la mañana (11:35, 13:35, 15:35, 17:35 UTC)
    # Horarios en Chile: ~07:35, ~09:35, ~11:35 y ~13:35.
    # Gracias al control anti-duplicados, el mensaje solo se envia una vez al dia.
    # Si la UdeC sube el menu a media mañana a inicio de mes, se detecta y envia en la siguiente corrida.
    - cron: "35 11,13,15,17 * * 1-5"
  workflow_dispatch: {}   # permite ejecutarlo a mano desde la pestana Actions

permissions:
  contents: write

jobs:
  menu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Scrapear y construir menu.json
        working-directory: scraper
        run: python build.py

      - name: Enviar menu de hoy por WhatsApp
        working-directory: scraper
        env:
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: python notify_whatsapp.py

      - name: Guardar cambios en el repositorio
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/menu.json data/estado.json
          if git diff --staged --quiet; then
            echo "Sin cambios para commitear."
          else
            git pull --rebase
            git commit -m "menu: sincronizar $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
